[project]
name = "fleetpulse"
version = "1.0.0"
description = "Predictive maintenance for connected vehicle fleets"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-q"

[tool.coverage.run]
source = ["fleetpulse"]
branch = true
# CLI entry points / one-off jobs run as subprocesses in integration tests and are not line-measured
omit = ["fleetpulse/simulator/run.py", "fleetpulse/simulator/seed.py", "fleetpulse/storage/seed_pg.py",
        "fleetpulse/storage/query_bench.py", "fleetpulse/ml/train.py",
        "fleetpulse/storage/apply_sql.py"]

[tool.coverage.report]
show_missing = false
skip_empty = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP", "I"]
ignore = ["S101", "S311", "S608", "B008", "S105", "S106", "E731", "E501", "B905", "UP042", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B023", "F841"]
"bench/**" = ["S", "B023"]

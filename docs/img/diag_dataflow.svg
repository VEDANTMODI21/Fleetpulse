<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 235" width="1200" height="235" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="16" y="26" font-size="16" font-weight="700" fill="#1f2328">Data flow of one telemetry event (latency per hop)</text><g><rect x="20" y="70" width="140" height="64" rx="8" fill="#fff" stroke="#1f6feb" stroke-width="2"/><rect x="20" y="70" width="6" height="64" rx="3" fill="#1f6feb"/><text x="93.0" y="99.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">Vehicle / OEM cloud</text><text x="93.0" y="114.0" text-anchor="middle" font-size="10.5" fill="#57606a">event generated</text></g><path d="M160,102 L190,102" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><text x="175" y="160" text-anchor="middle" font-size="10.5" fill="#57606a"><tspan x="175" dy="0">batch window</tspan><tspan x="175" dy="12">(sim: 1 s tick)</tspan></text><g><rect x="190" y="70" width="140" height="64" rx="8" fill="#fff" stroke="#0969da" stroke-width="2"/><rect x="190" y="70" width="6" height="64" rx="3" fill="#0969da"/><text x="263.0" y="92.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">Ingest</text><text x="263.0" y="107.0" text-anchor="middle" font-size="10.5" fill="#57606a">parse, validate,</text><text x="263.0" y="120.0" text-anchor="middle" font-size="10.5" fill="#57606a">VIN check, dedup</text></g><path d="M330,102 L360,102" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><text x="345" y="160" text-anchor="middle" font-size="10.5" fill="#57606a"><tspan x="345" dy="0">~28 us/event</tspan><tspan x="345" dy="12">(35K ev/s/core)</tspan></text><g><rect x="360" y="70" width="140" height="64" rx="8" fill="#fff" stroke="#bf8700" stroke-width="2"/><rect x="360" y="70" width="6" height="64" rx="3" fill="#bf8700"/><text x="433.0" y="99.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">Kafka</text><text x="433.0" y="114.0" text-anchor="middle" font-size="10.5" fill="#57606a">partition by VIN</text></g><path d="M500,102 L530,102" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><text x="515" y="160" text-anchor="middle" font-size="10.5" fill="#57606a"><tspan x="515" dy="0">&lt; 5 ms (est.)</tspan></text><g><rect x="530" y="70" width="140" height="64" rx="8" fill="#fff" stroke="#0969da" stroke-width="2"/><rect x="530" y="70" width="6" height="64" rx="3" fill="#0969da"/><text x="603.0" y="99.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">Stream worker</text><text x="603.0" y="114.0" text-anchor="middle" font-size="10.5" fill="#57606a">state + rules</text></g><path d="M670,102 L700,102" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><text x="685" y="160" text-anchor="middle" font-size="10.5" fill="#57606a"><tspan x="685" dy="0">~15 us/event</tspan></text><g><rect x="700" y="70" width="140" height="64" rx="8" fill="#fff" stroke="#0969da" stroke-width="2"/><rect x="700" y="70" width="6" height="64" rx="3" fill="#0969da"/><text x="773.0" y="99.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">Redis pub/sub</text><text x="773.0" y="114.0" text-anchor="middle" font-size="10.5" fill="#57606a">fan-out</text></g><path d="M840,102 L870,102" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><text x="855" y="160" text-anchor="middle" font-size="10.5" fill="#57606a"><tspan x="855" dy="0">&lt; 1 ms (est.)</tspan></text><g><rect x="870" y="70" width="140" height="64" rx="8" fill="#fff" stroke="#0969da" stroke-width="2"/><rect x="870" y="70" width="6" height="64" rx="3" fill="#0969da"/><text x="943.0" y="99.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">API SSE</text><text x="943.0" y="114.0" text-anchor="middle" font-size="10.5" fill="#57606a">tenant filter</text></g><path d="M1010,102 L1040,102" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><text x="1025" y="160" text-anchor="middle" font-size="10.5" fill="#57606a"><tspan x="1025" dy="0">50 ms poll</tspan></text><g><rect x="1040" y="70" width="140" height="64" rx="8" fill="#fff" stroke="#1f6feb" stroke-width="2"/><rect x="1040" y="70" width="6" height="64" rx="3" fill="#1f6feb"/><text x="1113.0" y="99.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2328">Dashboard</text><text x="1113.0" y="114.0" text-anchor="middle" font-size="10.5" fill="#57606a">alert rendered</text></g><text x="20" y="215" font-size="12" fill="#1f2328">Measured end to end (event timestamp -> alert received by a subscriber) on 2 vCPU: p50 0.50 s, p95 0.99 s, p99 1.36 s at 8K ev/s with 24K ev/s bursts (target: critical alert &lt; 5 s).</text></svg>
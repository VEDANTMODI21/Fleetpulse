<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 370" width="1040" height="370" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="16" y="26" font-size="16" font-weight="700" fill="#1f2328">Hexagonal layering of the stream / ingest services</text><rect x="40" y="50" width="820" height="62" rx="8" fill="#fff" stroke="#1f6feb" stroke-width="2"/><rect x="40" y="50" width="8" height="62" rx="3" fill="#1f6feb"/><text x="64" y="74" font-size="14" font-weight="700" fill="#1f2328">Presentation / API</text><text x="64" y="94" font-size="11" fill="#57606a">fleetpulse/api/app.py, ingest/service.py</text><text x="850" y="74" font-size="11" fill="#1f2328" text-anchor="end">HTTP, SSE, auth checks, DTOs, RFC7807 errors</text><path d="M900,81 L900,159" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="128" width="820" height="62" rx="8" fill="#fff" stroke="#1a7f37" stroke-width="2"/><rect x="40" y="128" width="8" height="62" rx="3" fill="#1a7f37"/><text x="64" y="152" font-size="14" font-weight="700" fill="#1f2328">Application</text><text x="64" y="172" font-size="11" fill="#57606a">ingest/pipeline.py, stream/worker.py, agent/copilot.py, ml/score.py</text><text x="850" y="152" font-size="11" fill="#1f2328" text-anchor="end">use cases, orchestration, transactions</text><path d="M900,159 L900,237" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="206" width="820" height="62" rx="8" fill="#fff" stroke="#8250df" stroke-width="2"/><rect x="40" y="206" width="8" height="62" rx="3" fill="#8250df"/><text x="64" y="230" font-size="14" font-weight="700" fill="#1f2328">Domain</text><text x="64" y="250" font-size="11" fill="#57606a">domain/models.py, algorithms/*, stream/processor.py</text><text x="850" y="230" font-size="11" fill="#1f2328" text-anchor="end">entities, rules, algorithms - no framework imports</text><path d="M900,237 L900,315" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="284" width="820" height="62" rx="8" fill="#fff" stroke="#bf8700" stroke-width="2"/><rect x="40" y="284" width="8" height="62" rx="3" fill="#bf8700"/><text x="64" y="308" font-size="14" font-weight="700" fill="#1f2328">Infrastructure (adapters)</text><text x="64" y="328" font-size="11" fill="#57606a">ingest/bus.py (Kafka|Redis|Memory), storage/repo.py, storage/audit.py, agent/kb.py</text><text x="850" y="308" font-size="11" fill="#1f2328" text-anchor="end">DB, broker, cache, vector store</text><text x="912" y="170" font-size="11" fill="#1f2328">depends on</text><text x="912" y="184" font-size="11" fill="#57606a">(inward only;</text><text x="912" y="198" font-size="11" fill="#57606a">adapters implement</text><text x="912" y="212" font-size="11" fill="#57606a">ports, e.g. EventBus)</text></svg>
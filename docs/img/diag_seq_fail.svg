f" stroke="#0969da" stroke-width="1.6"/><text x="1090.0" y="67" text-anchor="middle" font-size="12" font-weight="700">PostgreSQL</text><line x1="1090.0" y1="79" x2="1090.0" y2="510" stroke="#d0d7de" stroke-dasharray="4 4"/><line x1="110.0" y1="105" x2="306.0" y2="105" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/><text x="208.0" y="100" text-anchor="middle" font-size="11" fill="#57606a">POST batch (retry of a timed-out request)</text><path d="M306.0,129 h40 v14 h-38" fill="none" stroke="#57606a" marker-end="url(#a)"/><text x="352.0" y="139" font-size="11" fill="#57606a">Bloom says (vin,seq) seen -&gt; duplicate, dropped</text><line x1="110.0" y1="165" x2="306.0" y2="165" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/><text x="208.0" y="160" text-anchor="middle" font-size="11" fill="#57606a">payload in NEW OEM format</text><line x1="306.0" y1="195" x2="502.0" y2="195" stroke="#d1242f" stroke-width="1.5" marker-end="url(#a)"/><text x="404.0" y="190" text-anchor="middle" font-size="11" fill="#d1242f">-&gt; telemetry.dlq {error, raw}</text><line x1="306.0" y1="225" x2="110.0" y2="225" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5 4"/><text x="208.0" y="220" text-anchor="middle" font-size="11" fill="#57606a">200 {invalid: n} + IngestInvalidSpike alert</text><rect x="138.20000000000005" y="242" width="531.5999999999999" height="22" rx="4" fill="#fff8c5" stroke="#d4a72c"/><text x="404.0" y="257" text-anchor="middle" font-size="11">onboard: INSERT oem_mapping v2 -&gt; DeclarativeAdapter (no deploy); replay DLQ</text><line x1="502.0" y1="285" x2="698.0" y2="285" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/><text x="600.0" y="280" text-anchor="middle" font-size="11" fill="#57606a">poll 2,000 events</text><path d="M698.0,309 h40 v14 h-38" fill="none" stroke="#d1242f" marker-end="url(#a)"/><text x="744.0" y="319" font-size="11" fill="#d1242f">SIGKILL before commit</text><rect x="442.0" y="332" width="512.0" heig
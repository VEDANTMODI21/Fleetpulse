apiVersion: apps/v1
kind: Deployment
metadata: {name: api, labels: {{- include "fp.labels" . | nindent 4 }}}
spec:
  replicas: {{ .Values.api.replicas }}
  selector: {matchLabels: {app: api}}
  strategy: {rollingUpdate: {maxUnavailable: 0, maxSurge: 25%}}
  template:
    metadata: {labels: {app: api}, annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000"}}
    spec: {{- include "fp.pod" (dict "root" . "name" "api" "port" 8000 "resources" .Values.api.resources) | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata: {name: api}
spec: {selector: {app: api}, ports: [{port: 80, targetPort: 8000}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: {{ .Values.api.autoscaling.min }}
  maxReplicas: {{ .Values.api.autoscaling.max }}
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ .Values.api.autoscaling.cpu }}}}}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: api}
spec: {minAvailable: 2, selector: {matchLabels: {app: api}}}
